apiVersion: v1
kind: Namespace
metadata: {name: ngwaf}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: echo-src, namespace: ngwaf}
data:
  echo.py: |
    import http.server, socketserver, time, sys
    class H(http.server.BaseHTTPRequestHandler):
        def handle_one(self):
            rid = self.headers.get("X-Request-ID", "-")
            sg = ";".join(f"{k}={v}" for k, v in self.headers.items() if k.lower().startswith("x-sigsci"))
            allh = "|".join(f"{k}: {v}" for k, v in self.headers.items())
            sys.stdout.write(f"{time.time():.6f} method={self.command} rid={rid} sigsci=[{sg}] path={self.path} allheaders=[{allh}]\n"); sys.stdout.flush()
            body = b"ok\n"
            self.send_response(200); self.send_header("Content-Length", str(len(body))); self.end_headers(); self.wfile.write(body)
        do_GET = do_POST = do_PUT = handle_one
        def log_message(self, *a): pass
    class S(socketserver.ThreadingMixIn, http.server.HTTPServer): daemon_threads = True
    S(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: echo, namespace: ngwaf}
spec:
  replicas: 1
  selector: {matchLabels: {app: echo}}
  template:
    metadata: {labels: {app: echo}}
    spec:
      containers:
      - name: echo
        image: localhost/py:3.12-alpine
        imagePullPolicy: Never
        command: [python, -u, /src/echo.py]
        ports: [{containerPort: 8080}]
        volumeMounts: [{name: src, mountPath: /src}]
      volumes: [{name: src, configMap: {name: echo-src}}]
---
apiVersion: v1
kind: Service
metadata: {name: echo, namespace: ngwaf}
spec:
  selector: {app: echo}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: echo, namespace: ngwaf}
spec:
  ingressClassName: nginx
  rules:
  - host: echo.local
    http:
      paths:
      - {path: /, pathType: Prefix, backend: {service: {name: echo, port: {number: 80}}}}
