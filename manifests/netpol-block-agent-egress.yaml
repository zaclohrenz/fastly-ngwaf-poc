# Holds the controller pod (agent + nginx) with no egress except DNS (cluster-internal) so the agent cannot download rules.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: block-agent-egress, namespace: ingress-nginx}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: ingress-nginx, app.kubernetes.io/component: controller}}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
    ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
  - to:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ngwaf}}
  - to:
    - ipBlock: {cidr: 10.0.0.0/8}
